# Optional Postgres for the persistence layer.
# The demo does NOT need it: `npm run dev` works with no database.
services:
  postgres:
    image: postgres:16-alpine
    container_name: torob-tickets-db
    environment:
      POSTGRES_USER: torob
      POSTGRES_PASSWORD: torob
      POSTGRES_DB: torob_tickets
    ports:
      - "5432:5432"
    volumes:
      - torob-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torob -d torob_tickets"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  torob-pgdata:
